kind = "web"
previewPath = "/"
title = "عصابة الملاعب"
description = "لعبة تحقيق جماعية عربية بين فرق كرة القدم، مع تجربة محلية وغرف أونلاين لمشاركة الأصدقاء."
version = "1.0.0"
id = "artifacts/qatalin-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23308

[services.development]
run = "pnpm --filter @workspace/qatalin-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qatalin-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/qatalin-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23308"
BASE_PATH = "/"
