kind = "slides"
previewPath = "/qatalin-promo-deck/"
title = "عرض إطلاق عصابة الملاعب"
description = "عرض تقديمي عربي احترافي يشرح فكرة عصابة الملاعب، التحقيق، كروت المساعدة، الغرف الأونلاين، وما بعد النتيجة."
version = "1.0.0"
id = "artifacts/qatalin-promo-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/qatalin-promo-deck/" ]
localPort = 23149

[services.development]
run = "pnpm --filter @workspace/qatalin-promo-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qatalin-promo-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/qatalin-promo-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23149"
BASE_PATH = "/qatalin-promo-deck/"
